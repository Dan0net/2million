# Netlify configuration for Rent-a-Pixel
# Static site is served from the repo root; serverless functions live in netlify/functions.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The board PNG must never be cached by the CDN as a static asset — it is
# served by the `board` function and changes as pixels are claimed.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
