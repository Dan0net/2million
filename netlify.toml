# Netlify configuration for the 2 Million Dollar Homepage.
# Static site is served from the repo root; serverless functions live in netlify/functions.
#
# Cache-Control is set per-function: /api/board is served as a versioned,
# immutable asset (see config.rev); the other endpoints send no-store themselves.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
