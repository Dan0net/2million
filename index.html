<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>2 Million Dollar Homepage</title>
    <meta name="description" content="Two million pixels. $1 each, yours forever. Paint a pixel, add your link, own a piece of the homepage." />
    <meta name="theme-color" content="#6b7280" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="board" aria-label="Pixel canvas"></canvas>

      <!-- Owned-pixel tooltip -->
      <div id="tooltip" class="tooltip" hidden>
        <div id="ttSpinner" class="spinner" aria-hidden="true"></div>
        <div id="ttContent" hidden>
          <p id="ttDesc" class="tt-desc"></p>
          <a id="ttLink" class="tt-link" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>

      <!-- Control bar (always visible; buttons greyed until a pixel is selected) -->
      <section id="bar" class="bar" aria-label="Colours and checkout">
        <p class="bar-title">The 2 Million Dollar Pixel Homepage · 2mill.io</p>
        <p class="bar-hint">
          <span>2 million pixels — $1 per pixel — Own your slice of internet history!</span>
          <a class="tos-i" href="/terms.html" target="_blank" rel="noopener" aria-label="Terms of service" title="Terms of service">ⓘ</a>
        </p>
        <p class="bar-stats">
          <span id="statSold">0</span> sold · <span id="statLeft">2,000,000</span> left
          · <a href="/leaderboard.html">Leaderboard</a>
        </p>

        <div class="swatches" id="swatches">
          <button id="customSwatch" class="custom" title="Custom colour" aria-label="Custom colour"></button>
        </div>
        <div class="actions">
          <button id="clearBtn" class="ghost">Clear</button>
          <button id="buyBtn" class="primary">Buy</button>
        </div>
      </section>
    </main>

    <!-- Colour picker modal -->
    <div id="pickerModal" class="modal" hidden>
      <div class="modal-card picker-card" role="dialog" aria-modal="true" aria-label="Pick a colour">
        <h2>Pick a colour</h2>
        <div class="sv-wrap">
          <canvas id="svBox" class="sv-box" width="240" height="150"></canvas>
          <div id="svHandle" class="sv-handle"></div>
        </div>
        <div id="hueSlider" class="hue-slider"><div id="hueHandle" class="hue-handle"></div></div>
        <div class="picker-row">
          <span id="pickerPreview" class="picker-preview"></span>
          <input id="hexInput" class="hex" maxlength="7" placeholder="#rrggbb"
                 spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Hex colour code" />
          <button id="pickerUse" class="primary">Use</button>
        </div>
      </div>
    </div>

    <!-- Buy modal: description + URL before checkout -->
    <div id="buyModal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">Almost yours</h2>
        <p class="modal-sub" id="modalSub">Add a description and a link for your pixels.</p>
        <label class="field">
          <span>Description</span>
          <input id="descInput" type="text" maxlength="140" placeholder="e.g. My website, project, or shop" />
        </label>
        <label class="field">
          <span>Link (optional)</span>
          <input id="urlInput" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="example.com" />
        </label>
        <p id="modalErr" class="modal-err"></p>
        <div class="modal-actions">
          <button id="modalCancel" class="ghost">Cancel</button>
          <button id="modalContinue" class="primary">Buy</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
