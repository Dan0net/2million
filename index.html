<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Rent-a-Pixel — rent a pixel for $1/mo or own it for life</title>
    <meta name="description" content="A giant circular canvas of pixels. Rent one for $1/month, or buy it forever for $1000. Tap a pixel, pick a colour, claim your spot." />
    <meta name="theme-color" content="#0e1116" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23e63946'/%3E%3Crect x='44' y='44' width='12' height='12' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="ui-idle">
    <header id="topbar" class="topbar">
      <span class="brand-dot" aria-hidden="true"></span>
      <h1>Rent-a-Pixel</h1>
    </header>

    <main class="stage">
      <canvas id="board" aria-label="Pixel canvas"></canvas>

      <!-- Floating zoom controls (only visible once the sheet is open) -->
      <div id="zoomctl" class="zoomctl" aria-label="Zoom">
        <button id="zoomIn" title="Zoom in">＋</button>
        <button id="zoomOut" title="Zoom out">－</button>
        <button id="zoomReset" title="Fit board">⤢</button>
      </div>

      <!-- Bottom sheet: hidden on landing, revealed on first tap -->
      <section id="sheet" class="sheet" aria-label="Your pixels">
        <button id="grip" class="grip" aria-label="Show or hide colours"></button>

        <div class="sheet-colours" id="colours">
          <p class="colours-label">Pick a colour</p>
          <div class="colours-row">
            <div class="swatches" id="swatches"></div>
            <label class="custom" title="Custom colour">
              <input type="color" id="colorInput" value="#e63946" />
            </label>
          </div>
        </div>

        <div class="sheet-body">
          <div class="summary">
            <button class="active-chip" id="activeChip" title="Change colour" aria-label="Change colour"></button>
            <div class="summary-text">
              <b><span id="count">0</span></b> pixel<span id="plural"></span>
            </div>
            <div class="modes" role="radiogroup" aria-label="Rent or buy">
              <label class="seg">
                <input type="radio" name="mode" value="rent" checked />
                <span>Rent<small>$1/mo</small></span>
              </label>
              <label class="seg">
                <input type="radio" name="mode" value="buy" />
                <span>Buy<small>$1000</small></span>
              </label>
            </div>
          </div>

          <div class="total-row">
            <span>Total</span>
            <span id="total" class="total">$0</span>
          </div>

          <div class="actions">
            <button id="clearBtn" class="ghost" disabled>Clear</button>
            <button id="checkoutBtn" class="primary" disabled>Select pixels</button>
          </div>
          <p id="fineprint" class="fineprint"></p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
